pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // Phase 4B-2: LiveKit Android SDK needs JitPack for one transitive dep (audioswitch)
        maven { url 'https://jitpack.io' }
    }
}

rootProject.name = "NexVoice"
include ':app'
